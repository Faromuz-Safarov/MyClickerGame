
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Clicker Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>⚡ Clicker Game</h1>

    <p class="subtitle">Click your way to greatness!</p>

    <p class="score">
      Points: <span id="points">0</span>
    </p>

    <button id="clickButton">CLICK ME!</button>

    <p>Points per click: <span id="power">1</span></p>

    <button id="upgradeButton">
      Buy Upgrade (Cost: <span id="cost">10</span>)
    </button>

    <p id="message">Start clicking to earn points!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
